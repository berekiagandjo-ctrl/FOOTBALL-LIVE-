<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Football Live</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#f4f7f5;
    --card:#ffffff;
    --text:#101828;
    --muted:#667085;
    --border:#e4e7ec;

    --green:#087443;
    --green2:#12b76a;
    --green-light:#e8f7ef;

    --red:#d92d20;

    --shadow:
    0 5px 20px rgba(16,24,40,.07);
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:80px;
}

button{
    font-family:inherit;
    cursor:pointer;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    background:
    linear-gradient(
        135deg,
        #032f1e,
        #087443
    );

    color:white;

    padding:
    16px
    15px
    22px;

    border-radius:
    0
    0
    28px
    28px;
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.menu-btn,
.icon-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    color:white;
    font-size:20px;
}

.logo{
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#8ff0b7;
}

.header-actions{
    display:flex;
    gap:7px;
}


/* =====================================================
   SEARCH
===================================================== */

.search{
    height:46px;
    background:white;
    border-radius:13px;
    margin-top:17px;

    display:flex;
    align-items:center;

    padding:0 13px;

    color:#667085;
}

.search input{
    width:100%;
    border:0;
    outline:0;

    padding:0 9px;

    font-size:14px;
}


/* =====================================================
   API STATUS
===================================================== */

.api-status{
    display:flex;
    align-items:center;
    gap:7px;

    margin-top:11px;

    font-size:10px;
}

.api-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#f79009;
}

.api-dot.ok{
    background:#12b76a;
}

.api-dot.error{
    background:#f04438;
}


/* =====================================================
   CONTENT
===================================================== */

.page{
    display:none;
}

.page.active{
    display:block;
}

.section{
    padding:0 15px;
    margin-top:18px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:12px;
}

.section-title h2{
    font-size:18px;
}

.section-title span{
    color:var(--green);
    font-size:10px;
    font-weight:900;
}


/* =====================================================
   DATE
===================================================== */

.date-row{
    display:flex;
    gap:8px;

    overflow-x:auto;

    padding:
    15px
    15px
    4px;
}

.date-row::-webkit-scrollbar{
    display:none;
}

.date{
    flex-shrink:0;

    min-width:82px;

    border:
    1px solid
    var(--border);

    background:var(--card);

    border-radius:13px;

    padding:9px 7px;

    text-align:center;

    color:var(--text);
}

.date strong{
    display:block;
    font-size:11px;
}

.date span{
    display:block;
    margin-top:4px;

    color:var(--muted);
    font-size:10px;
}

.date.active{
    background:var(--green);
    color:white;
    border-color:var(--green);
}

.date.active span{
    color:#c9f7da;
}


/* =====================================================
   FILTERS
===================================================== */

.filters{
    display:flex;
    gap:8px;

    overflow-x:auto;

    padding:
    9px
    15px
    4px;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter{
    flex-shrink:0;

    border:
    1px solid
    var(--border);

    background:white;

    color:var(--muted);

    border-radius:20px;

    padding:
    10px
    16px;

    font-size:10px;
    font-weight:900;
}

.filter.active{
    background:var(--green);
    color:white;
    border-color:var(--green);
}


/* =====================================================
   MATCH CARD
===================================================== */

.match-card{
    background:var(--card);

    border:
    1px solid
    var(--border);

    border-radius:19px;

    padding:14px;

    margin-bottom:11px;

    box-shadow:var(--shadow);
}

.match-top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:15px;
}

.league{
    display:flex;
    align-items:center;
    gap:7px;

    color:var(--muted);

    font-size:10px;
    font-weight:800;
}

.league-logo{
    width:21px;
    height:21px;
    object-fit:contain;
}

.status{
    padding:5px 9px;
    border-radius:8px;

    font-size:8px;
    font-weight:900;
}

.status.live{
    background:#fee4e2;
    color:#d92d20;
}

.status.finished{
    background:#f2f4f7;
    color:#475467;
}

.status.upcoming{
    background:var(--green-light);
    color:var(--green);
}

.teams{
    display:grid;

    grid-template-columns:
    1fr
    75px
    1fr;

    align-items:center;

    text-align:center;
}

.club{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
}

.club-logo{
    width:55px;
    height:55px;

    object-fit:contain;

    padding:6px;

    background:#f8fafc;

    border:
    1px solid
    #eaecf0;

    border-radius:50%;
}

.club-name{
    max-width:115px;

    font-size:11px;
    font-weight:800;

    line-height:1.3;
}

.score{
    font-size:25px;
    font-weight:950;
}

.time{
    margin-top:5px;

    color:var(--muted);

    font-size:10px;
}

.minute{
    margin-top:5px;

    color:var(--red);

    font-size:10px;
    font-weight:900;
}

.match-info{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;

    gap:10px;

    margin-top:13px;

    color:var(--muted);

    font-size:9px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:7px;

    margin-top:13px;

    padding-top:11px;

    border-top:
    1px solid
    var(--border);
}

.action{
    border:0;

    background:var(--bg);

    color:var(--muted);

    border-radius:9px;

    padding:10px;

    font-size:9px;
    font-weight:900;
}


/* =====================================================
   HOME SECTIONS
===================================================== */

.category-card{
    background:var(--card);

    border:
    1px solid
    var(--border);

    border-radius:17px;

    padding:13px;

    margin-bottom:9px;

    display:flex;
    align-items:center;
    gap:12px;

    box-shadow:var(--shadow);
}

.category-icon{
    width:42px;
    height:42px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--green-light);

    font-size:20px;
}

.category-info{
    flex:1;
}

.category-info strong{
    display:block;
    font-size:12px;
}

.category-info span{
    display:block;
    margin-top:3px;

    color:var(--muted);
    font-size:9px;
}

.category-arrow{
    color:var(--muted);
}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.loading,
.empty{
    background:var(--card);

    border:
    1px solid
    var(--border);

    border-radius:18px;

    padding:28px 15px;

    text-align:center;

    color:var(--muted);

    box-shadow:var(--shadow);
}

.spinner{
    width:34px;
    height:34px;

    border:
    3px solid
    #dfe5e1;

    border-top-color:
    var(--green);

    border-radius:50%;

    margin:
    0
    auto
    12px;

    animation:
    spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.empty-icon{
    font-size:35px;
    margin-bottom:9px;
}

.empty strong{
    display:block;
    color:var(--text);
    margin-bottom:5px;
}

.error-box{
    background:#fff6f5;

    border:
    1px solid
    #fecdca;

    color:#b42318;

    border-radius:16px;

    padding:16px;

    font-size:11px;

    line-height:1.6;
}


/* =====================================================
   LIVE HEADER
===================================================== */

.live-title{
    display:flex;
    align-items:center;
    gap:8px;
}

.live-dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:#d92d20;

    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    50%{
        opacity:.35;
    }
}


/* =====================================================
   LEAGUE PAGE
===================================================== */

.league-grid{
    display:grid;

    grid-template-columns:
    1fr
    1fr;

    gap:10px;
}

.league-card{
    background:var(--card);

    border:
    1px solid
    var(--border);

    border-radius:16px;

    padding:15px 10px;

    text-align:center;

    box-shadow:var(--shadow);
}

.league-card img{
    width:48px;
    height:48px;

    object-fit:contain;

    margin-bottom:8px;
}

.league-card strong{
    display:block;
    font-size:11px;
}

.league-card span{
    display:block;

    margin-top:4px;

    color:var(--muted);

    font-size:9px;
}


/* =====================================================
   DETAIL MATCH
===================================================== */

.detail-header{
    background:
    linear-gradient(
        135deg,
        #032f1e,
        #f87443
    );

    color:white;

    padding:
    16px
    15px
    30px;

    border-radius:
    0
    0
    28px
    28px;
}

.back-btn{
    width:42px;
    height:42px;

    border:0;

    background:
    rgba(255,255,255,.14);

    color:white;

    border-radius:50%;

    font-size:20px;
}

.detail-league{
    text-align:center;

    margin-top:-32px;

    font-size:10px;
}

.detail-teams{
    display:grid;

    grid-template-columns:
    1fr
    90px
    1fr;

    align-items:center;

    text-align:center;

    margin-top:22px;
}

.detail-logo{
    width:70px;
    height:70px;

    object-fit:contain;

    background:white;

    border-radius:50%;

    padding:8px;
}

.detail-team{
    margin-top:8px;

    font-size:11px;
    font-weight:900;
}

.detail-score{
    font-size:34px;
    font-weight:950;
}

.detail-minute{
    margin-top:4px;

    color:#a4f5c3;

    font-size:9px;
    font-weight:900;
}


/* =====================================================
   DETAIL TABS
===================================================== */

.detail-tabs{
    display:flex;

    gap:4px;

    background:var(--card);

    padding:5px;

    margin:
    -17px
    15px
    15px;

    border-radius:15px;

    box-shadow:
    0 5px 18px
    rgba(0,0,0,.1);
}

.detail-tab{
    flex:1;

    border:0;

    background:none;

    color:var(--muted);

    padding:11px 3px;

    border-radius:9px;

    font-size:8px;
    font-weight:900;
}

.detail-tab.active{
    background:var(--green-light);
    color:var(--green);
}


/* =====================================================
   DETAIL BOX
===================================================== */

.detail-box{
    background:var(--card);

    border:
    1px solid
    var(--border);

    border-radius:18px;

    padding:15px;

    margin:
    0
    15px
    13px;
}

.detail-box h3{
    font-size:14px;
    margin-bottom:14px;
}


/* =====================================================
   EVENTS
===================================================== */

.event{
    display:grid;

    grid-template-columns:
    35px
    32px
    1fr;

    align-items:center;

    min-height:48px;

    border-bottom:
    1px solid
    var(--border);
}

.event:last-child{
    border-bottom:0;
}

.event-time{
    color:var(--muted);

    font-size:9px;
    font-weight:900;
}

.event-icon{
    font-size:16px;
}

.event-text{
    font-size:10px;
    font-weight:800;
}


/* =====================================================
   STATISTICS
===================================================== */

.stat{
    margin-bottom:19px;
}

.stat-head{
    display:grid;

    grid-template-columns:
    45px
    1fr
    45px;

    text-align:center;

    align-items:center;
}

.stat-value{
    font-size:11px;
    font-weight:900;
}

.stat-name{
    color:var(--muted);
    font-size:9px;
}

.stat-bar{
    height:7px;

    margin-top:6px;

    background:#eaecf0;

    border-radius:10px;

    overflow:hidden;
}

.stat-fill{
    height:100%;

    background:
    linear-gradient(
        90deg,
        #087443,
        #12b76a
    );
}


/* =====================================================
   COMPOSITIONS
===================================================== */

.player{
    display:flex;
    align-items:center;
    gap:10px;

    padding:10px 0;

    border-bottom:
    1px solid
    var(--border);
}

.player img{
    width:42px;
    height:42px;

    border-radius:50%;

    object-fit:cover;

    background:var(--bg);
}

.player strong{
    display:block;
    font-size:10px;
}

.player span{
    display:block;
    margin-top:3px;

    color:var(--muted);
    font-size:8px;
}


/* =====================================================
   STANDINGS
===================================================== */

.table{
    width:100%;

    border-collapse:collapse;

    font-size:9px;
}

.table th{
    color:var(--muted);

    font-weight:800;

    padding:8px 3px;
}

.table td{
    padding:10px 3px;

    border-top:
    1px solid
    var(--border);

    text-align:center;
}

.table td:nth-child(2){
    text-align:left;
    font-weight:800;
}

.team-small{
    display:flex;
    align-items:center;
    gap:7px;
}

.team-small img{
    width:24px;
    height:24px;

    object-fit:contain;
}


/* =====================================================
   SIDE MENU
===================================================== */

.overlay{
    display:none;

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.48);

    z-index:2000;
}

.overlay.show{
    display:block;
}

.side-menu{
    position:absolute;

    top:0;
    bottom:0;
    left:0;

    width:82%;
    max-width:330px;

    background:var(--card);

    padding:20px 15px;

    overflow-y:auto;
}

.menu-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:22px;
}

.menu-title{
    font-size:20px;
    font-weight:900;
}

.close-menu{
    width:40px;
    height:40px;

    border:0;
    border-radius:50%;

    background:var(--bg);

    font-size:20px;
}

.menu-item{
    width:100%;

    border:0;

    background:none;

    padding:14px 10px;

    border-radius:11px;

    display:flex;
    align-items:center;

    gap:13px;

    color:var(--text);

    text-align:left;

    font-size:12px;
    font-weight:800;
}

.menu-item:hover{
    background:var(--green-light);
    color:var(--green);
}

.menu-icon{
    width:28px;
    text-align:center;
    font-size:18px;
}

.menu-separator{
    height:1px;
    background:var(--border);
    margin:10px 0;
}


/* =====================================================
   BOTTOM NAVIGATION
===================================================== */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:70px;

    background:var(--card);

    border-top:
    1px solid
    var(--border);

    display:flex;

    justify-content:space-around;
    align-items:center;

    z-index:1000;
}

.nav-btn{
    flex:1;

    border:0;

    background:none;

    color:#98a2b3;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:4px;

    font-size:8px;
    font-weight:900;
}

.nav-icon{
    font-size:20px;
}

.nav-btn.active{
    color:var(--green);
}


/* =====================================================
   DARK MODE
===================================================== */

body.dark{

    --bg:#0c1711;
    --card:#14231b;
    --text:#f5f7f6;
    --muted:#98a2b3;
    --border:#293c31;
    --green-light:#173d29;
}

body.dark .search{
    background:#14231b;
}

body.dark .search input{
    background:transparent;
    color:white;
}

body.dark .filter{
    background:var(--card);
}

body.dark .club-logo{
    background:#1d3025;
}

body.dark .action{
    background:#1c2d23;
}

body.dark .stat-bar{
    background:#26382d;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(min-width:700px){

    body{
        max-width:650px;
        margin:auto;
        box-shadow:0 0 40px rgba(0,0,0,.08);
        min-height:100vh;
    }

    .bottom-nav{
        max-width:650px;
        left:50%;
        transform:translateX(-50%);
    }

}

</style>

</head>

<body>


<!-- =====================================================
     MENU LATÉRAL
===================================================== -->

<div
id="menuOverlay"
class="overlay"
onclick="closeMenu(event)">

    <aside
    class="side-menu"
    onclick="event.stopPropagation()">

        <div class="menu-head">

            <div class="menu-title">
                Football Live
            </div>

            <button
            class="close-menu"
            onclick="closeMenu()">
                ×
            </button>

        </div>


        <button
        class="menu-item"
        onclick="navigate('home')">

            <span class="menu-icon">🏠</span>
            Accueil

        </button>


        <button
        class="menu-item"
        onclick="navigate('live')">

            <span class="menu-icon">🔴</span>
            Matchs en direct

        </button>


        <button
        class="menu-item"
        onclick="navigate('matches')">

            <span class="menu-icon">📅</span>
            Calendrier des matchs

        </button>


        <button
        class="menu-item"
        onclick="navigate('leagues')">

            <span class="menu-icon">🏆</span>
            Compétitions

        </button>


        <button
        class="menu-item"
        onclick="navigate('favorites')">

            <span class="menu-icon">⭐</span>
            Mes favoris

        </button>


        <div class="menu-separator"></div>


        <button
        class="menu-item"
        onclick="toggleDark()">

            <span class="menu-icon">🌙</span>
            Mode sombre

        </button>


        <button
        class="menu-item"
        onclick="refreshCurrentPage()">

            <span class="menu-icon">🔄</span>
            Actualiser

        </button>

    </aside>

</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-top">

        <div class="header-left">

            <button
            class="menu-btn"
            onclick="openMenu()">
                ☰
            </button>

            <div class="logo">
                FOOTBALL <span>LIVE</span>
            </div>

        </div>


        <div class="header-actions">

            <button
            class="icon-btn"
            onclick="showNotifications()">
                🔔
            </button>

        </div>

    </div>


    <div class="search">

        🔎

        <input
        id="searchInput"
        type="text"
        placeholder="Rechercher une équipe, un joueur..."
        oninput="globalSearch()">

    </div>


    <div class="api-status">

        <div
        id="apiDot"
        class="api-dot">
        </div>

        <span id="apiStatus">
            Connexion aux données...
        </span>

    </div>

</header>


<!-- =====================================================
     PAGE ACCUEIL
===================================================== -->

<mai
